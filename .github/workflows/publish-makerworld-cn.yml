name: Publish MakerWorld CN image

on:
  push:
    branches:
      - feature/makerworld-cn-import
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-makerworld-cn
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tete1030/bambuddy' && github.ref == 'refs/heads/feature/makerworld-cn-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The Dockerfile copies .git/HEAD so SpoolBuddy can detect this branch.
      - name: Restore branch metadata at the triggering commit
        run: |
          git checkout -B feature/makerworld-cn-import "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git symbolic-ref --short HEAD)" = feature/makerworld-cn-import

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tete1030/bambuddy:makerworld-cn
            ghcr.io/tete1030/bambuddy:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=makerworld-cn
          cache-to: type=gha,scope=makerworld-cn,mode=max

      - name: Report published image
        run: echo "ghcr.io/tete1030/bambuddy:sha-${GITHUB_SHA} ${{ steps.build.outputs.digest }}"
